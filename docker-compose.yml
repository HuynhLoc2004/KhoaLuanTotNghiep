version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: museum_mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=museum

  redis:
    image: redis:7-alpine
    container_name: museum_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: museum_backend
    restart: always
    depends_on:
      - mongodb
      - redis
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/museum
      - REDIS_URI=redis://redis:6379
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://103.178.233.206}
      - CLOUDINARY_URL=cloudinary://525596288476341:zLtV43liy-USXPkPDMmscuXum0k@djkif9ubs
      - CLOUDINARY_CLOUD_NAME=djkif9ubs
      - CLOUDINARY_API_KEY=525596288476341
      - CLOUDINARY_API_SECRET=zLtV43liy-USXPkPDMmscuXum0k
      - CLOUDINARY_ROOT_FOLDER=museum
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=huynhtanlocpp09@gmail.com
      - SMTP_PASS=csvopdsnfnonsuxy
      - SMTP_FROM="Bảo Tàng Lịch Sử TP.HCM <huynhtanlocpp09@gmail.com>"
      - R2_ACCOUNT_ID=58adca9a5a385f5db2618f638bfda563
      - R2_ACCESS_KEY_ID=17ab384cadd165105b47172b7f45409b
      - R2_SECRET_ACCESS_KEY=1a87ee4bd56e583f00e73408f1174bc26002053a233339867b166579fac3cb84
      - R2_BUCKET_NAME=museum
      - R2_PUBLIC_DOMAIN=https://pub-bb1eeff16fd349f2abb33e4e71fe1ae7.r2.dev
    volumes:
      - uploads_data:/app/backend/public/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: museum_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_data:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
  redis_data:
    driver: local
  certbot_data:
    driver: local
