        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: museum_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_data:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./maintenance_flag:/var/www/maintenance
