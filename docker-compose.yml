version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: museum_mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=museum

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: museum_backend
    restart: always
    depends_on:
      - mongodb
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/museum
      - CLOUDINARY_URL=cloudinary://525596288476341:zLtV43liy-USXPkPDMmscuXum0k@djkif9ubs
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://103.178.233.206}
    volumes:
      - uploads_data:/app/backend/public/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: museum_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
