version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: museum_mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=museum
    command: mongod --wiredTigerCacheSizeGB 1.5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: museum_postgres
    restart: always
    environment:
      POSTGRES_DB: museum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me-postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: museum_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: museum_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: museum_admin
      RABBITMQ_DEFAULT_PASS: change-me-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: museum_backend
    restart: always
    depends_on:
      - mongodb
      - postgres
      - redis
      - rabbitmq
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/museum
      - PG_URI=postgresql://postgres:change-me-postgres@postgres:5432/museum
      - REDIS_URI=redis://redis:6379
      - RABBITMQ_URI=amqp://museum_admin:change-me-rabbitmq@rabbitmq:5672
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://museumhcm.duckdns.org}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID:-f1fc37c9-1be6-4ddf-a282-d0e731299f5a}
      - PAYOS_API_KEY=${PAYOS_API_KEY:-853e52fc-22e0-47f7-90b9-fd0cef9531f3}
