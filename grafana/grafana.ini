[server]
protocol = http
http_port = 3000
domain = museumhcm.duckdns.org
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[security]
allow_embedding = true
cookie_secure = true
cookie_samesite = lax

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
enable_login_token = false
sync_ttl = 60

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Admin
default_theme = dark

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/museum_analytics.json
