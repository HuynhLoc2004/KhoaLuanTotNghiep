<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống Quản trị Tour 360 - Bảo tàng Lịch sử TP. Hồ Chí Minh</title>
    <!-- Google Fonts: Be Vietnam Pro (Vietnamese Optimized) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Pannellum 360 Engine & FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Cổng dịch tự động đa ngôn ngữ cho Client -->
    <div id="google_translate_element" style="display:none; visibility:hidden; width:0; height:0; overflow:hidden;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'vi',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }

      // Giữ cố định vị trí đỉnh trang, triệt tiêu 100% thanh banner iframe của Google
      (function() {
        function suppressGoogleBanner() {
          if (document.body) {
            if (document.body.style.top && document.body.style.top !== '0px') {
              document.body.style.top = '0px';
            }
            if (document.body.style.position === 'relative') {
              document.body.style.position = 'static';
            }
          }
          var frames = document.querySelectorAll('body > .skiptranslate, iframe[id*=":"], .goog-te-banner-frame');
          for (var i = 0; i < frames.length; i++) {
            var f = frames[i];
            if (f.id !== 'google_translate_element') {
              f.style.setProperty('display', 'none', 'important');
              f.style.setProperty('visibility', 'hidden', 'important');
              f.style.setProperty('height', '0px', 'important');
              f.style.setProperty('width', '0px', 'important');
              f.style.setProperty('opacity', '0', 'important');
              f.style.setProperty('pointer-events', 'none', 'important');
            }
          }
        }
        var obs = new MutationObserver(suppressGoogleBanner);
        obs.observe(document.documentElement, { attributes: true, childList: true, subtree: true });
        window.addEventListener('load', suppressGoogleBanner);
      })();
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
