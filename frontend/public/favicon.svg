<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C2D19" />
      <stop offset="100%" stop-color="#5A1A0C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4A86A" />
      <stop offset="100%" stop-color="#AA7C39" />
    </linearGradient>
  </defs>
  <!-- Nền đỏ sơn son di sản với góc bo mềm mại đồng bộ biểu trưng bảo tàng -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.85" />
  
  <!-- Biểu trưng chữ BT hoàng gia sắc nét đồng bộ 100% với logo website -->
  <text x="32" y="44" font-family="'Be Vietnam Pro', system-ui, -apple-system, sans-serif, Arial" font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="1">BT</text>
</svg>