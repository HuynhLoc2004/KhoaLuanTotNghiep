# HTTP Server (Port 80)
server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Cấu hình chế độ bảo trì hệ thống (Maintenance Mode)
    set $maintenance 0;
    if (-f /usr/share/nginx/html/maintenance.flag) {
        set $maintenance 1;
    }
    if (-f /var/www/maintenance/maintenance.flag) {
        set $maintenance 1;
    }
    # Ngoại lệ: Không áp dụng bảo trì cho trang bảo trì, favicon, static assets và toàn bộ API backend
    if ($uri ~* "^/(maintenance\.html|favicon\.svg|icons\.svg|assets/|api/)") {
        set $maintenance 0;
    }
    # Quản trị viên đã đăng nhập có cookie bypass có thể truy cập để kiểm thử
    if ($http_cookie ~* "museum_admin_bypass=1") {
        set $maintenance 0;
    }
    if ($maintenance = 1) {
        return 503;
    }

    # Bắt lỗi khi backend khởi động lại hoặc tạm ngắt kết nối
    error_page 502 503 504 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Proxy API sang Backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy uploads & ảnh stitched 360
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static Assets có hash (Vite js, css)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Single Page App (React index.html không được cache để luôn cập nhật code mới)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}

# HTTPS Server (Port 443 với SSL)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
