        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy uploads & ảnh stitched 360
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
