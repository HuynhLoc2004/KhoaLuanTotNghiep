# ==============================================================================
# HỆ THỐNG PHÒNG VỆ & TỐI ƯU HÓA TẠI CỔNG NGINX (EDGE REVERSE PROXY)
# Bảo vệ trước khi yêu cầu đến Server Backend, giảm tải và chống tấn công
# ==============================================================================

# 1. Nhận diện và chặn đứng các công cụ rà quét lỗ hổng & Bot độc hại
map $http_user_agent $bad_client {
    default 0;
    ~*(sqlmap|nikto|wpscan|masscan|dirbuster|nmap|acunetix|nessus|openvas|havij|zmeu|morfeus) 1;
}

# 2. Giới hạn số lượng kết nối đồng thời từ 1 địa chỉ IP (Anti-Slowloris / DDoS)
limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

# 3. Giới hạn tần suất gọi API chung (30 requests/giây)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;

# 4. Giới hạn riêng cho Trợ lý AI (/api/ai/) để chống spam và bảo vệ tài nguyên tính toán
limit_req_zone $binary_remote_addr zone=api_ai_limit:10m rate=20r/m;

# 5. Giới hạn riêng cho cổng Đăng nhập / Xác thực (/api/auth/) chống dò mật khẩu Brute-force
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=10r/m;

# HTTP Server (Port 80) - Tự động chuyển toàn bộ truy cập sang HTTPS bảo mật
server {
    listen 80;
    server_name museumhcm.duckdns.org localhost _;

    client_max_body_size 500M;

    # Let's Encrypt ACME Challenge (phục vụ tự động gia hạn SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tự động chuyển hướng toàn bộ truy cập HTTP sang HTTPS an toàn
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (Port 443 với SSL)
server {
    listen 443 ssl;
    server_name museumhcm.duckdns.org localhost _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 500M;
    client_body_buffer_size 256k;
    client_header_buffer_size 4k;

    # Tối ưu kết nối & giới hạn từ 1 IP
    limit_conn addr_conn_limit 40;
    limit_req_status 429;
    limit_conn_status 429;

    # Chặn các Bot / Scanner độc hại ngay tại cổng Nginx
    if ($bad_client = 1) {
        return 403;
    }

    # Chặn các HTTP Method nguy hiểm không sử dụng
    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)$) {
        return 405;
    }

    # Gzip Compression cho Production
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers tiêu chuẩn cao
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Cấu hình chế độ bảo trì hệ thống (Maintenance Mode)
    set $maintenance 0;
    if (-f /usr/share/nginx/html/maintenance.flag) {
        set $maintenance 1;
    }
    if (-f /var/www/maintenance/maintenance.flag) {
        set $maintenance 1;
    }
    # Ngoại lệ theo URI nội bộ (Bắt buộc để Nginx phục vụ trang /maintenance.html khi redirect error_page 503)
    if ($uri ~* "^/(maintenance\.html|favicon\.svg|icons\.svg|assets/|api/|uploads/)") {
        set $maintenance 0;
    }
    # Ngoại lệ theo URL trình duyệt gốc (Bắt buộc để admin-login không bị chặn khi SPA try_files rewrite sang index.html)
    if ($request_uri ~* "^/(maintenance\.html|favicon\.svg|icons\.svg|assets/|api/|uploads/|admin-login|admin)") {
        set $maintenance 0;
    }
    if ($maintenance = 1) {
        return 503;
    }

    # Bắt lỗi khi backend khởi động lại hoặc tạm ngắt kết nối
    error_page 502 503 504 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 1. Hỗ trợ Realtime Server-Sent Events (SSE) lập tức không bị đệm
    location /api/system/realtime-stream {
        proxy_pass http://backend:3000/api/system/realtime-stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # 2. Bảo vệ cổng Trợ lý AI (/api/ai/): Giới hạn tần suất và chống lạm dụng tài nguyên
    location /api/ai/ {
        limit_req zone=api_ai_limit burst=6 nodelay;
        proxy_pass http://backend:3000/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # 3. Bảo vệ cổng Xác thực Admin (/api/auth/): Chống Brute-Force mật khẩu
    location /api/auth/ {
        limit_req zone=api_auth_limit burst=5 nodelay;
        proxy_pass http://backend:3000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # 4. Proxy API chung sang Backend (Áp dụng rate-limit 30r/s)
    location /api/ {
        limit_req zone=api_general_limit burst=40 nodelay;
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 5. Proxy uploads & ảnh stitched 360 với CORS cho WebGL & 3D GLB/GLTF
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers * always;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, no-transform";
    }

    # 6. Static Assets có hash (Vite js, css) được Nginx phục vụ trực tiếp
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        open_file_cache max=5000 inactive=120s;
        open_file_cache_valid 180s;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;
    }

    # 7. Cổng đăng nhập Admin luôn mở trực tiếp kể cả khi đang bật chế độ bảo trì
    location ~* ^/(admin-login|admin) {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 8. Frontend Single Page App (React index.html không được cache để luôn cập nhật code mới)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
