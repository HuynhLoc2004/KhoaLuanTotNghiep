# HTTP Server (Port 80)
server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # Gzip Compression cho Production
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;


    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Cấu hình chế độ bảo trì hệ thống (Maintenance Mode)
    set $maintenance 0;
    if (-f /usr/share/nginx/html/maintenance.flag) {
        set $maintenance 1;
    }
    if (-f /var/www/maintenance/maintenance.flag) {
        set $maintenance 1;
    }
    # Ngoại lệ theo URI nội bộ (Bắt buộc để Nginx phục vụ trang /maintenance.html khi redirect error_page 503)
    if ($uri ~* "^/(maintenance\.html|favicon\.svg|icons\.svg|assets/|api/|uploads/)") {
        set $maintenance 0;
    }
    # Ngoại lệ theo URL trình duyệt gốc (Bắt buộc để admin-login không bị chặn khi SPA try_files rewrite sang index.html)
    if ($request_uri ~* "^/(maintenance\.html|favicon\.svg|icons\.svg|assets/|api/|uploads/|admin-login|admin)") {
        set $maintenance 0;
    }
    if ($maintenance = 1) {
        return 503;
    }

    # Bắt lỗi khi backend khởi động lại hoặc tạm ngắt kết nối
    error_page 502 503 504 /maintenance.html;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Proxy API sang Backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy uploads & ảnh stitched 360 với CORS cho WebGL
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers * always;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Static Assets có hash (Vite js, css)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cổng đăng nhập Admin luôn mở trực tiếp kể cả khi đang bật chế độ bảo trì
    location ~* ^/(admin-login|admin) {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Frontend Single Page App (React index.html không được cache để luôn cập nhật code mới)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}

# HTTPS Server (Port 443 với SSL)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 500M;

    # Gzip Compression cho Production
    gzip on;
    gzip_vary on;
