name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Tên nhánh (branch) muốn deploy lên VPS'
        required: false
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy via Docker Compose

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: false
          script: |
            exec 2>&1
            TARGET_BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
            echo "========================================================"
            echo "🚀 TIẾN HÀNH DEPLOY NHÁNH: $TARGET_BRANCH"
            echo "========================================================"

            echo ">>> [1/4] Xác định và di chuyển vào thư mục dự án chuẩn..."
            git config --global --add safe.directory "*" || true

            PROJECT_DIR="/root/KhoaLuanTotNghiep"
            if [ -d "/root/KhoaLuanTotNghiep" ]; then
              PROJECT_DIR="/root/KhoaLuanTotNghiep"
            elif [ -d "/root/KhoaluanTotNghiep" ] && [ -d "/root/KhoaluanTotNghiep/.git" ]; then
              PROJECT_DIR="/root/KhoaluanTotNghiep"
            else
              mkdir -p "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            echo ">>> Đang làm việc tại: $(pwd)"

            echo ">>> [BẢO TRÌ] Kích hoạt cờ bảo trì hệ thống ngay khi nhận code mới..."
            mkdir -p maintenance_flag
            touch maintenance_flag/maintenance.flag
            docker exec museum_frontend touch /usr/share/nginx/html/maintenance.flag 2>/dev/null || true
            sudo touch /var/www/museum/maintenance.flag 2>/dev/null || true

            # Kiểm tra Docker Engine
            if ! command -v docker &> /dev/null; then
              echo ">>> Đang cài đặt Docker Engine..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
            fi

            echo ">>> [2/5] Kéo mã nguồn nhánh [$TARGET_BRANCH] từ GitHub..."
            if [ ! -d ".git" ]; then
              echo ">>> Thư mục chưa có git repo, tiến hành clone mới..."
              git clone -b "$TARGET_BRANCH" https://github.com/HuynhLoc2004/KhoaLuanTotNghiep.git .
            else
              echo ">>> Cập nhật code từ origin/$TARGET_BRANCH..."
              git status || true
              git remote remove origin 2>/dev/null || true
              git remote add origin https://github.com/HuynhLoc2004/KhoaLuanTotNghiep.git || true
              git fetch origin "$TARGET_BRANCH" || true
              git checkout "$TARGET_BRANCH" 2>/dev/null || git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH" || true
              git reset --hard "origin/$TARGET_BRANCH" || true
              git clean -fd || true
              git pull origin "$TARGET_BRANCH" || true
            fi

            # Đảm bảo cờ bảo trì vẫn duy trì sau khi git pull
            mkdir -p maintenance_flag
            touch maintenance_flag/maintenance.flag

            # Đảm bảo Docker daemon dùng DNS ổn định (Google DNS / Cloudflare) chống TLS handshake timeout
            if [ ! -f /etc/docker/daemon.json ] || ! grep -q "8.8.8.8" /etc/docker/daemon.json 2>/dev/null; then
              echo ">>> Tối ưu hóa DNS cho Docker daemon (8.8.8.8, 1.1.1.1)..."
              mkdir -p /etc/docker
              echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' > /etc/docker/daemon.json
              systemctl restart docker || true
              sleep 3
            fi

            echo ">>> [3/5] Build & Khởi chạy các container Docker..."
            if docker compose version &>/dev/null; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            echo ">>> Sử dụng lệnh Docker: $COMPOSE_CMD"
            
            # Thử build với cơ chế tự động thử lại 3 lần nếu mạng Docker Hub quốc tế chập chờn
            DEPLOY_SUCCESS=false
            for attempt in 1 2 3; do
              echo ">>> Thực thi deploy (Lần $attempt/3)..."
              if $COMPOSE_CMD up -d --build --remove-orphans; then
                DEPLOY_SUCCESS=true
                echo ">>> Deploy thành công ở lần thử $attempt!"
                break
              fi
              echo "⚠️ Lần thử $attempt thất bại do mạng Docker Hub timeout, nghỉ 5s rồi thử lại..."
              sleep 5
            done

            if [ "$DEPLOY_SUCCESS" != "true" ]; then
              echo "❌ Deploy thất bại sau 3 lần thử!"
              rm -f maintenance_flag/maintenance.flag || true
              exit 1
            fi

            # Đảm bảo Nginx nhận diện chứng chỉ SSL Let's Encrypt nếu có
            if [ -f "scripts/setup-ssl.sh" ]; then
              echo ">>> Kiểm tra và làm mới chứng chỉ SSL..."
              bash scripts/setup-ssl.sh || true
            fi

            echo ">>> [4/5] Kiểm tra sức khỏe hệ thống Backend (Healthcheck)..."
            MAX_RETRIES=45
            COUNT=0
            until curl -s -f http://127.0.0.1:3000/api/health > /dev/null || [ $COUNT -ge $MAX_RETRIES ]; do
              COUNT=$((COUNT + 1))
              echo "Chờ Backend online và sẵn sàng kết nối... ($COUNT/$MAX_RETRIES)"
              sleep 2
            done

            echo ">>> [5/5] Gỡ bỏ cờ bảo trì - Khôi phục hệ thống trực tuyến..."
            rm -f maintenance_flag/maintenance.flag || true
            docker exec museum_frontend rm -f /usr/share/nginx/html/maintenance.flag 2>/dev/null || true
            docker exec museum_frontend rm -f /var/www/maintenance/maintenance.flag 2>/dev/null || true
            sudo rm -f /var/www/museum/maintenance.flag 2>/dev/null || true

            docker image prune -f || true
            $COMPOSE_CMD ps

            echo "========================================================"
            echo "🎉 CI/CD DEPLOY HOÀN TẤT THÀNH CÔNG RỰC RỠ!"
            echo "Khách và Admin sẽ tự động kết nối lại vào phiên bản mới."
            echo "========================================================"
