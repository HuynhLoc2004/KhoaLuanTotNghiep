name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy via Docker Compose

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: false
          script: |
            exec 2>&1
            echo ">>> [1/4] Xác định và di chuyển vào thư mục dự án chuẩn..."
            git config --global --add safe.directory "*" || true

            PROJECT_DIR="/root/KhoaLuanTotNghiep"
            if [ -d "/root/KhoaLuanTotNghiep" ]; then
              PROJECT_DIR="/root/KhoaLuanTotNghiep"
            elif [ -d "/root/KhoaluanTotNghiep" ] && [ -d "/root/KhoaluanTotNghiep/.git" ]; then
              PROJECT_DIR="/root/KhoaluanTotNghiep"
            else
              mkdir -p "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            echo ">>> Đang làm việc tại: $(pwd)"

            # Kiểm tra Docker Engine
            if ! command -v docker &> /dev/null; then
              echo ">>> Đang cài đặt Docker Engine..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
            fi

            echo ">>> [2/4] Kéo mã nguồn mới nhất từ GitHub..."
            if [ ! -d ".git" ]; then
              echo ">>> Thư mục chưa có git repo, tiến hành clone mới..."
              git clone https://github.com/HuynhLoc2004/KhoaLuanTotNghiep.git .
            else
              echo ">>> Cập nhật code từ origin/main..."
              git status || true
              git remote remove origin 2>/dev/null || true
              git remote add origin https://github.com/HuynhLoc2004/KhoaLuanTotNghiep.git || true
              git fetch origin main || true
              git reset --hard origin/main || true
              git clean -fd || true
              git pull origin main || true
            fi

            echo ">>> [3/4] Build & Khởi chạy các container Docker..."
            if docker compose version &>/dev/null; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            echo ">>> Sử dụng lệnh Docker: $COMPOSE_CMD"
            $COMPOSE_CMD up -d --build --remove-orphans

            # Đảm bảo Nginx nhận diện chứng chỉ SSL Let's Encrypt nếu có
            if [ -f "scripts/setup-ssl.sh" ]; then
              echo ">>> Kiểm tra và làm mới chứng chỉ SSL..."
              bash scripts/setup-ssl.sh || true
            fi

            echo ">>> [4/4] Dọn dẹp image cũ & Kiểm tra trạng thái..."
            docker image prune -f || true
            $COMPOSE_CMD ps

            echo "========================================================"
            echo "🎉 CI/CD DEPLOY HOÀN TẤT THÀNH CÔNG RỰC RỠ!"
            echo "========================================================"
