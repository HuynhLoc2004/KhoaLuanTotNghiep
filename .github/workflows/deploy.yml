name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Tên nhánh (branch) muốn deploy lên VPS'
        required: false
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy via Docker Compose

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          timeout: 60s
          script_stop: false
          script: |
            exec 2>&1
            TARGET_BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
            echo "========================================================"
            echo "🚀 TIẾN HÀNH DEPLOY NHÁNH: $TARGET_BRANCH"
            echo "========================================================"

            echo ">>> [1/4] Xác định và di chuyển vào thư mục dự án chuẩn..."
            git config --global --add safe.directory "*" || true

            PROJECT_DIR="/root/KhoaLuanTotNghiep"
            if [ -d "/root/KhoaLuanTotNghiep" ]; then
              PROJECT_DIR="/root/KhoaLuanTotNghiep"
            elif [ -d "/root/KhoaluanTotNghiep" ] && [ -d "/root/KhoaluanTotNghiep/.git" ]; then
              PROJECT_DIR="/root/KhoaluanTotNghiep"
            else
              mkdir -p "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            echo ">>> Đang làm việc tại: $(pwd)"

            # Kiểm tra Docker Engine
            if ! command -v docker &> /dev/null; then
              echo ">>> Đang cài đặt Docker Engine..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
            fi

            echo ">>> [2/4] Kéo mã nguồn nhánh [$TARGET_BRANCH] từ GitHub..."
            if [ ! -d ".git" ]; then
              echo ">>> Thư mục chưa có git repo, tiến hành clone mới..."
              git clone -b "$TARGET_BRANCH" https://github.com/HuynhLoc2004/KhoaLuanTotNghiep.git .
            else
              echo ">>> Cập nhật code từ origin/$TARGET_BRANCH..."
              git status || true
              git remote remove origin 2>/dev/null || true
              git remote add origin https://github.com/HuynhLoc2004/KhoaLuanTotNghiep.git || true
              git fetch origin "$TARGET_BRANCH" || true
              git checkout "$TARGET_BRANCH" 2>/dev/null || git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH" || true
              git reset --hard "origin/$TARGET_BRANCH" || true
              git clean -fd || true
              git pull origin "$TARGET_BRANCH" || true
            fi

            # Cấu hình DNS phân giải quốc tế (Google & Cloudflare) cho VPS & Docker daemon chống nghẽn mạng quốc tế
            echo ">>> Cập nhật DNS Google & Cloudflare cho Docker daemon..."
            mkdir -p /etc/docker
            echo '{"dns": ["8.8.8.8", "1.1.1.1", "8.8.4.4"]}' > /etc/docker/daemon.json
            systemctl reload docker 2>/dev/null || systemctl restart docker 2>/dev/null || true
            sleep 2

            echo ">>> [3/4] Build & Khởi chạy các container Docker (Zero-Downtime Background Build)..."
            if docker compose version &>/dev/null; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            echo ">>> Sử dụng lệnh Docker: $COMPOSE_CMD"
            
            # Ưu tiên sử dụng base image đã cache sẵn trên VPS (DOCKER_BUILDKIT=0),
            # tránh việc BuildKit bắt buộc phải kết nối ra registry-1.docker.io gây TLS handshake timeout khi mạng quốc tế chập chờn
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0

            DEPLOY_SUCCESS=false
            for attempt in 1 2 3; do
              echo ">>> Thực thi deploy (Lần $attempt/3)..."
              if [ $attempt -eq 2 ]; then
                echo ">>> Thử lại lần 2 với chế độ BuildKit chuẩn..."
                unset DOCKER_BUILDKIT
                unset COMPOSE_DOCKER_CLI_BUILD
              elif [ $attempt -eq 3 ]; then
                echo ">>> Thử lại lần 3 với cờ legacy..."
                export DOCKER_BUILDKIT=0
                export COMPOSE_DOCKER_CLI_BUILD=0
              fi

              if $COMPOSE_CMD up -d --build --remove-orphans; then
                DEPLOY_SUCCESS=true
                echo ">>> Deploy thành công ở lần thử $attempt!"
                break
              fi
              echo "⚠️ Lần thử $attempt thất bại do mạng Docker Hub quốc tế chập chờn, thử lại sau 3s..."
              sleep 3
            done

            if [ "$DEPLOY_SUCCESS" != "true" ]; then
              echo "❌ Deploy thất bại sau 3 lần thử!"
              rm -f maintenance_flag/maintenance.flag || true
              exit 1
            fi

            # Đảm bảo Nginx nhận diện chứng chỉ SSL Let's Encrypt nếu có
            if [ -f "scripts/setup-ssl.sh" ]; then
              echo ">>> Kiểm tra và làm mới chứng chỉ SSL..."
              bash scripts/setup-ssl.sh || true
            fi

            echo ">>> [4/4] Kiểm tra sức khỏe hệ thống Backend (Healthcheck)..."
            MAX_RETRIES=45
            COUNT=0
            until curl -s -f http://127.0.0.1:3000/api/health > /dev/null || [ $COUNT -ge $MAX_RETRIES ]; do
              COUNT=$((COUNT + 1))
              echo "Chờ Backend online và sẵn sàng kết nối... ($COUNT/$MAX_RETRIES)"
              sleep 2
            done

            docker image prune -f || true
            $COMPOSE_CMD ps

            echo "========================================================"
            echo "🎉 CI/CD DEPLOY HOÀN TẤT THÀNH CÔNG (ZERO-DOWNTIME)!"
            echo "Hệ thống đã cập nhật phiên bản mới nhất mượt mà."
            echo "========================================================"
